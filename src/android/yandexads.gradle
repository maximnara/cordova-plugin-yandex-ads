// Applied by Cordova as a plugin Gradle extension. Kotlin must be configured
// here: preferences in res/xml/config.xml do not enable the build plugin.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${project.cordovaConfig.KOTLIN_VERSION}"
    }
}

apply plugin: 'org.jetbrains.kotlin.android'

android {
    kotlinOptions {
        jvmTarget = cordovaConfig.KOTLIN_JVM_TARGET ?: cordovaConfig.JAVA_TARGET_COMPATIBILITY.toString()
    }
}

dependencies {
    implementation 'com.yandex.android:mobileads:8.6.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.18.1'
}
