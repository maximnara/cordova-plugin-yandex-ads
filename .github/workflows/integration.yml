name: Device integration tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      cases:
        description: 'Optional test name regex (empty runs the whole suite)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Native SDK (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    defaults:
      run:
        shell: bash
    env:
      INTEGRATION_CASE: ${{ inputs.cases }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle bootstrap
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.14.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Enable KVM access
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Cordova and integration dependencies
        run: |
          npm install --no-audit --no-fund
          npm ci --prefix tests/integration --no-audit --no-fund

      - name: Install Appium platform driver
        env:
          TEST_PLATFORM: ${{ matrix.platform }}
        run: npm run test:integration:setup -- "$TEST_PLATFORM"

      - name: Test Android on an emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 4G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: npm run test:integration -- android

      - name: Test iOS on a simulator
        if: matrix.platform == 'ios'
        run: npm run test:integration -- ios

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-${{ matrix.platform }}
          path: .artifacts/integration/${{ matrix.platform }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
